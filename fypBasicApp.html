<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <title> Basic mouth animation app</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    </head>
    <style>
        body {
          display: flex;
          justify-content: center;  /* Center horizontally */
          align-items: center;  /* Center vertically */
          height: 100vh;  /* Full viewport height */
          margin: 0;  /* Remove default margin */
        }
        .content {
          text-align: left;  /* Align the text inside the container to the left */
          font-size: 40px;
        }

        /* Change the colour of the slider thumb in settings */
        .form-range::-webkit-slider-thumb {
          background-color: black; 
          border: none;
        }
        .form-range::-moz-range-thumb {
          background-color: black;
          border: none;
        }

      </style>
    <body>
        <center>
        <!--<img id="mouthDisplay" src="mouths/closedMouth.png">-->
        <!--<canvas id="mouthCanvas" width="255" height="255"></canvas>-->
        <canvas id="mouthCanvas" width="400" height="400"></canvas>
        <br>

        <!--
        <label for="colours">Mouth background colour:</label>
        <select id="colours" name="colours">
            <option value="white" selected="selected">white</option>
            <option value="#150DF7">blue</option>
            <option value="#04F404">green</option>
        </select><br>
        -->

        <!--
        <label for="speeds">Mouth Speak Speed:</label>
        <select id="speeds" name="speeds">
            <option value="verySlow">very slow</option>
            <option value="slow">slow</option>
            <option value="medium" selected="selected">medium</option>
            <option value="fast">fast</option>
        </select><br>
        -->

        <!--
        <label for="voiceSelect">Mouth Voice:</label>
        <select id="voiceSelect">
          <option value="">Select a voice</option>
        </select>
        -->

        <div class="content">
        <p id="wordDisplay">Isn't it nice my friend to see so many elephants</p>
        </div>
        <br>
        <label for="wordsInput" style="font-size: 20px;">Enter the words you wish the mouth to say</label><br>
        <textarea id="wordsInput" name="wordsInput" rows="10" cols="80">Isn't it nice my friend to see so many elephants</textarea><br>
        <button id="generateButton" class="btn btn-outline-secondary"> Generate mouth animation </button>
        <br>

        <button id="xButton" class="btn btn-outline-secondary" title="Stop the mouth speaking"> 
          <img src="icons/slash-circle.svg">
        </button>
        <button id="micButton" class="btn btn-outline-secondary">
          <img src="icons/mic-fill.svg">
        </button>
        <button id="downloadVideoButton" disabled="true" class="btn btn-outline-secondary">
          <img src="icons/download.svg">
        </button>
        <button data-bs-toggle="offcanvas" href="#offcanvasExample" role="button" aria-controls="offcanvasExample" class="btn btn-outline-secondary">
          <img src="icons/gear.svg">
        </button>
        

        <p id="phoneticVersion">həˈləʊ</p><br>
        
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasExampleLabel">Settings</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
            <h4>Choose settings for the mouth</h3><br>

            <!-- Mouth display background colour -->
            <label for="colours">Mouth Background Colour</label><br><br>
            <img src="icons/palette.svg" width="50" height="50"><br><br>
            <select id="colours" name="colours" class="form-select">
              <option value="white" selected="selected">White</option>
              <option value="#150DF7">Blue</option>
              <option value="#04F404">Green</option>
            </select><br>

            <!-- Mouth speak speed -->
            <label for="speeds">Mouth Speak Speed</label><br><br>
            <img src="icons/speedometer.svg" width="50" height="50"><br><br>
            <select id="speeds" name="speeds" class="form-select">
                <option value="verySlow">very slow</option>
                <option value="slow">Slow</option>
                <option value="medium" selected="selected">Medium</option>
                <option value="fast">Fast</option>
            </select><br>

            <!-- Mouth voice -->
            <label for="voiceSelect">Mouth Voice</label><br><br>
            <img src="icons/robot.svg" width="50" height="50"><br><br>
            <select id="voiceSelect" class="form-select">
              <option value="">Select a voice</option>
            </select><br>

            <!-- Mouth size -->
            <label for="mouthSize">Mouth Size</label><br><br>
            <img src="icons/aspect-ratio.svg" width="50" height="50"><br><br>
            <input type="range" id="mouthSize" min="100" max="1000" value="400" class="form-range">
          </div>
        </div>
        <!-------->
        </center>
        
    </body>
    <script src="jsFiles/mouthAnimCode.js" type="module"></script>
</html>
