<!DOCTYPE html>
<html lang="en-GB">
    <head>
        <title> Basic mouth animation app</title>
    </head>
    <style>
        body {
          display: flex;
          justify-content: center;  /* Center horizontally */
          align-items: center;  /* Center vertically */
          height: 100vh;  /* Full viewport height */
          margin: 0;  /* Remove default margin */
        }
        .content {
          text-align: left;  /* Align the text inside the container to the left */
        }
      </style>
    <body>
        <center>
        <!--<img id="mouthDisplay" src="mouths/closedMouth.png">-->
        <canvas id="mouthCanvas" width="255" height="255"></canvas>
        <br>
        <label for="colours">Mouth background colour:</label>
        <select id="colours" name="colours">
            <option value="white" selected="selected">white</option>
            <option value="#150DF7">blue</option>
            <option value="#04F404">green</option>
        </select><br>
        <label for="speeds">Mouth Speak Speed:</label>
        <select id="speeds" name="speeds">
            <option value="verySlow">very slow</option>
            <option value="slow">slow</option>
            <option value="medium" selected="selected">medium</option>
            <option value="fast">fast</option>
        </select><br>
        <label for="voiceSelect">Mouth Voice:</label>
        <select id="voiceSelect">
          <option value="">Select a voice</option>
        </select>

        <div class="content">
        <p id="wordDisplay">Isn't it nice my friend to see so many elephants</p>
        </div>
        <br>
        <label for="wordsInput">Enter the words you wish the mouth to say</label><br>
        <textarea id="wordsInput" name="wordsInput" rows="5" cols="33">Isn't it nice my friend to see so many elephants</textarea><br>
        <button id="generateButton" > Generate mouth animation </button> <button id="xButton"> ❌ </button> <button id="micButton"> 🎤 </button> 

   

        <p id="phoneticVersion">həˈləʊ</p><br>
        <button id="downloadVideoButton" disabled="true"> Download animation as mp4 </button><br>
        </center>
        
    </body>
    <script src="jsFiles/mouthAnimCode.js" type="module"></script>
</html>
